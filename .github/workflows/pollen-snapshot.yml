name: Pollen heatmap snapshot

# CAMS Europe is re-run once a day, so two snapshots a day keep the
# heatmap fresh while staying well inside Open-Meteo's free limits.
on:
  schedule:
    - cron: "23 4,16 * * *"   # 04:23 and 16:23 UTC
  workflow_dispatch: {}        # "Run workflow" button for a manual refresh

concurrency:
  group: pollen-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install psycopg2-binary==2.9.9
      - name: Build and store snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/build_pollen_grid.py
